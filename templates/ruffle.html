<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta -->
        <meta charset="utf-8"/>
        <!-- Title and Icon -->
        <title id="pageTitle">Social Empires</title>
        <link rel="shortcut icon" href="img/icon.gif"/>
        <link rel="icon" type="image/png" href="img/icon.gif"/>
        <script>window.RufflePlayer = window.RufflePlayer || {}; var BIG = !new URLSearchParams(location.search).has("small"); if (BIG) document.documentElement.classList.add("big"); window.RufflePlayer.config = Object.assign({publicPath: "/ruffle/", autoplay: "on", unmuteOverlay: "hidden", logLevel: "warn"}, BIG ? {scale: "noScale", forceScale: true, salign: "tl", forceAlign: true} : {});</script>
        <script src="/ruffle/ruffle.js"></script>
        <style>
            /* Full-window mode (default). Use ?small for the original 760x600 page. */
            html.big, html.big body { margin: 0; padding: 0; overflow: hidden; background: #669C2C; }
            html.big #header, html.big #gameBar { display: none; }
        </style>
    </head>
    <body style="font-family: 'lucida grande',tahoma,verdana,arial,sans-serif">
    <center>
        <!-- SESSION HEADER -->
        <div id="header" style="width: 760px; margin-top: 50px;">
            <div id="session" style="float: right;">
                <p style="display:inline">Logged in as <b>{{save_info.name}}</b> lvl {{save_info.level}} (<a href="/">logout</a>)</p>
            </div>
        </div>
        <br>
        <!-- GAME BAR -->
        <div id="gameBar" style="margin-top: 15px;">
            <!-- GAME BAR TOP -->
            <div id="gamebar_top" style="width: 760px; height: 90px;">
                <div style="float: left; margin-left:155px; padding: 4px; font-size: 10pt">
                    <!-- VERSION -->
                    <br><br><br>
                    <p style="display: inline">{{ version }}</p>
                </div>
            </div>
            <!-- GAME BAR BUTTONS -->
            <div id="gamebar_buttons" style="width: 760px;">
                &nbsp;
                <a class="gameBarButton" href="#"><div><img src="img/gift.png">Free Gifts</div></a>
                <a class="gameBarButton gameBarButtonSelected" href="#"><div><img>Play</div></a>
                <a class="gameBarButton" href="#"><div><img src="img/cash.png">Get Cash</div></a>
                <a class="gameBarButton" href="https://discord.gg/zW5gSbQJBw" target="_blank"><div><img src="img/discord.png">Discord</div></a>
                <a class="gameBarButton" href="https://github.com/AcidCaos/socialemperors#readme" target="_blank"><div><img src="img/github.png">GitHub</div></a>
            </div>
            <style>
                #gameBar {
                    text-align: left;
                    width: 760px;
                    margin-bottom: 0px;
                    padding: 0px;
                    background-color:rgb(137, 187, 15);
                    background-image: url('img/Gamebar_byTrevo.png');
                    background-repeat: no-repeat;
                    background-size: contain;
                    border-bottom: solid #6e5335 3px;
                }
                .gameBarButton {
                    display: inline-block;
                    height: 19px;
                    color: black;
                    border: solid 1.5px;
                    border-color: #9e7747;
                    background-color:rgb(255, 245, 131);
                    border-top-left-radius: 5px;
                    border-top-right-radius: 5px;
                    cursor: pointer;
                    text-decoration: none;
                    font-size: 11pt;
                    padding: 2px 3px 1px 3px; 
                }

                .gameBarButtonSelected {
                    background-color:rgb(233, 221, 81);
                }

                .gameBarButton img {
                    height: 17px;
                    padding-right: 3px;
                    vertical-align: middle;
                }

                .gameBarButton:hover {
                    background-color:rgb(250, 237, 90);
                    text-decoration: none;
                }

                .gameBarButtonSelected:hover {
                    background-color:rgb(223, 212, 82);
                }

            </style>
        </div>
        <!-- EMBED GAME -->
        <object>
            <div id='ruffle'></div>
            <script>
                var ruffle = window.RufflePlayer.newest(),
                player = Object.assign(document.getElementById("ruffle").appendChild(ruffle.createPlayer()), {
                    style: BIG ? 'position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background-color: #669C2C; display: block;' : 'width: 760px; height: 600px; background-color: #669C2C;',
                });
                player.load({ // https://ruffle.rs/js-docs/master/interfaces/URLLoadOptions.html
                    url: "http://{{SERVERIP}}:5050/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf?swftoload=http://{{SERVERIP}}:5050/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}",
                    backgroundColor: "#669C2C",
                    allowScriptAccess: false,
                    autoplay: true,
                    parameters: '\
                        spdebug=notnull&brk=0\
                        &staticUrl=http://{{SERVERIP}}:5050/default01.static.socialpointgames.com/static/socialempires/&brk=0\
                        &dynamicUrl=http://{{SERVERIP}}:5050/dynamic.flash1.dev.socialpoint.es/appsfb/socialempiresdev/srvempires/&brk=0\
                        &skiphash12341=notnull&brk=0\
                        &fb_sig_user={{save_info.userid}}&brk=0\
                        &user_key=123456789&brk=0\
                        &language=en&brk=0\
                        &accessToken=AAABbZAm0wdMUBALsOrR0Ho68CLjaOT8SV3vftKg9mbo1zZColaW5FljRVaLxPGxXXnm1M98mTZCAttcQ4GHwvSyXfsyxYmvKMH8Hmn5iliSPnjvIsZA6&brk=0\
                        &sex=m&brk=0\
                        &lastLoggedIn=1349266517&brk=0\
                        &dailyBonus=0&brk=0\
                        &friendsInfo={{friendsInfo | tojson}}&brk=0\
                        &serverTime={{serverTime}}&brk=0\
                        &forceSyncError=1&brk=0\
                        &forceAttackReload=0&brk=0\
                        &forceQuestReload=0&brk=0'
                });
            </script>
        </object>
    </center>
    
    <!-- LOCAL CHEAT PANEL: instant free "purchases". Talks to /cheat/grant on this machine only. -->
    <style>
        #cheatToggle { position: fixed; right: 8px; bottom: 8px; z-index: 10; width: 30px; height: 30px; border-radius: 50%;
            border: 2px solid #6e5335; background: #f5e36b; font: bold 16px sans-serif; cursor: pointer; opacity: .75; }
        #cheatToggle:hover { opacity: 1; }
        #cheatPanel { position: fixed; right: 8px; bottom: 46px; z-index: 10; display: none; width: 210px; padding: 10px;
            background: #fff5c8; border: 2px solid #6e5335; border-radius: 8px; font: 12px sans-serif; color: #222; }
        #cheatPanel button { margin: 2px 2px 2px 0; padding: 3px 6px; font-size: 12px; cursor: pointer; }
        #cheatPanel .row { margin-bottom: 6px; } #cheatPanel b { display: block; margin-bottom: 2px; }
        #cheatMsg { min-height: 14px; font-size: 11px; color: #555; }
    </style>
    <button id="cheatToggle" title="Free resources (local only)">$</button>
    <div id="cheatPanel">
        <b>Free resources (local only)</b>
        <div id="cheatRows"></div>
        <div class="row"><button data-act='{"action":"level","delta":1}'>Level +1</button>
            <button data-act='{"action":"max_level"}'>Max level</button></div>
        <div id="cheatMsg">The game reloads after each change.</div>
    </div>
    <script>
        (function () {
            var rows = [["gold", "Gold"], ["wood", "Wood"], ["stone", "Stone"], ["food", "Food"], ["cash", "Cash"]];
            var amounts = {cash: [100, 1000], def: [10000, 100000]};
            var box = document.getElementById("cheatRows");
            rows.forEach(function (r) {
                var a = amounts[r[0]] || amounts.def, div = document.createElement("div");
                div.className = "row"; div.innerHTML = "<b>" + r[1] + "</b>";
                a.forEach(function (n) {
                    var btn = document.createElement("button");
                    btn.textContent = "+" + n.toLocaleString("en-US");
                    btn.dataset.act = JSON.stringify({action: "add", resource: r[0], amount: n});
                    div.appendChild(btn);
                });
                box.appendChild(div);
            });
            var msg = document.getElementById("cheatMsg"), panel = document.getElementById("cheatPanel");
            document.getElementById("cheatToggle").onclick = function () {
                panel.style.display = panel.style.display === "block" ? "none" : "block";
            };
            panel.addEventListener("click", function (e) {
                if (!e.target.dataset || !e.target.dataset.act) return;
                msg.textContent = "Working...";
                fetch("/cheat/grant", {method: "POST", headers: {"Content-Type": "application/json"}, body: e.target.dataset.act})
                    .then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
                    .then(function (res) {
                        if (!res[0]) { msg.textContent = "Error: " + (res[1].error || "failed"); return; }
                        msg.textContent = "Done. Reloading...";
                        setTimeout(function () { location.reload(); }, 1500);
                    })
                    .catch(function (err) { msg.textContent = "Error: " + err; });
            });
        })();
    </script>
</body>
</html>
